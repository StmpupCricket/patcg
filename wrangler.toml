name = "video-url-extractor"
main = "worker.js"
compatibility_date = "2024-01-01"

# Optional: Add KV namespace for storing results
[[kv_namespaces]]
binding = "VIDEO_URLS"
id = "your-kv-namespace-id"

# Environment variables
[vars]
DEBUG = "false"

# Production environment
[env.production]
vars = { DEBUG = "false" }

# Development environment
[env.dev]
vars = { DEBUG = "true" }
