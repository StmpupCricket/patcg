# wrangler.toml - Corrected version
name = "patcg"
main = "src/index.js"
compatibility_date = "2024-12-18"

# Remove unsupported fields
# logging was removed as it's not supported in this version

# Environment variables
[vars]
# You can add environment-specific variables here

# Routes configuration
# routes = [
#   { pattern = "embed.example.com/*", zone_name = "example.com" }
# ]

# Observability
[observability]
enabled = true

# Limits
[limits]
cpu_ms = 50

# If you need durable objects, uncomment and fix the binding format
# [[durable_objects]]
# bindings = [
#   { name = "COUNTER", class_name = "Counter" }
# ]

# If you need KV namespaces, uncomment and fix
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "your-kv-id"

# If you need R2 buckets, uncomment and fix
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"
